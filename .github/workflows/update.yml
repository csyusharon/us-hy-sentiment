name: update-data

# 排程 UTC 16:00 = Asia/Taipei 00:00 翌日 ≈ 美東 11:00-12:00。
# 選這個時段是因為 FRED 對 HY OAS / Treasury / VIX 等日頻系列大約在美東 9-10 AM
# publish 當日(T-1 收盤值);抓在這之後才會拿到「昨天」收盤,而不是「再前一天」。
# 不掛 push 觸發,避免「commit data.json → 觸發 workflow → 再 commit」的迴圈。
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Fetch FRED data
        run: npm run fetch

      - name: Commit updated data.json (only if changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --staged --quiet; then
            echo "data.json unchanged — skipping commit"
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "data: daily update ${DATE}"
            git push
          fi
